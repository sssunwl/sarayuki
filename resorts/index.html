  function draw(){ctx.clearRect(0,0,w,h);wind+=(windTarget-wind)*.02;for(const f of flakes){f.ph+=.01*f.sw;const dx=f.x-pointer.x,dy=f.y-pointer.y,d2=dx*dx+dy*dy;if(d2<12000){const d=Math.sqrt(d2)||1,p=(1-d/110)*1.6;f.vx+=dx/d*p;f.y+=dy/d*p*.6}f.vx*=.94;f.x+=Math.sin(f.ph)*.35*f.sw+wind*(.4+f.z)+f.vx;f.y+=f.vy;if(f.y>h+5)Object.assign(f,make(-5));if(f.x>w+5)f.x=-5;else if(f.x<-5)f.x=w+5;ctx.globalAlpha=.35+f.z*.6;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fillStyle="#fff";ctx.fill()}if(running)raf=requestAnimationFrame(draw)}
  function start(){if(running||reduceMotion||!visible)return;running=true;raf=requestAnimationFrame(draw)}function stop(){running=false;cancelAnimationFrame(raf)}
  resize();addEventListener("resize",()=>{resize();if(reduceMotion)draw()});host.addEventListener("pointermove",event=>{const rect=canvas.getBoundingClientRect();pointer.x=event.clientX-rect.left;pointer.y=event.clientY-rect.top;windTarget=((pointer.x/w)-.5)*3});host.addEventListener("pointerleave",()=>{pointer.x=pointer.y=-999;windTarget=0});new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;visible?start():stop()}).observe(host);document.addEventListener("visibilitychange",()=>document.hidden?stop():start());if(reduceMotion)draw();else start();
}
document.querySelectorAll(".snowfx").forEach(snowfall);
const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("in");revealObserver.unobserve(entry.target)}}),{threshold:.15,rootMargin:"0px 0px -40px"});
const observeReveal=root=>root.querySelectorAll(".reveal:not(.in)").forEach(element=>revealObserver.observe(element));
const nav=document.getElementById("nav"),pageHeader=document.querySelector(".app-header");let navTicking=false;
function updateNav(){nav.classList.toggle("solid",scrollY>pageHeader.offsetHeight-80);navTicking=false}addEventListener("scroll",()=>{if(!navTicking){navTicking=true;requestAnimationFrame(updateNav)}},{passive:true});updateNav();
const LEVELS={beginner:"第一次 OK",intermediate:"會轉彎",advanced:"老手"};
const AREAS={hokkaido:"北海道",tohoku:"東北",nagano:"長野",niigata:"新潟"};
const AREA_ORDER={hokkaido:0,tohoku:1,nagano:2,niigata:3};
const TAGS={powder:["❄️","粉雪"],tree:["🌲","樹林滑"],onsen:["♨️","溫泉"],night:["🌙","夜滑"],family:["👨‍👩‍👧","親子"],international:["🌐","外語友善"],skiinout:["🏨","住宿直通雪場"],backcountry:["⛰","非壓雪區"],daytrip:["🚄","城市一日來回"],snowmonster:["🌨","樹冰"],longseason:["📅","滑到春天"]};
const MONTHS=[11,12,1,2,3,4,5];
const VALID={level:new Set(Object.keys(LEVELS)),tag:new Set(Object.keys(TAGS)),area:new Set(Object.keys(AREAS))};
const currentMonth=Number(new Intl.DateTimeFormat("en-US",{month:"numeric",timeZone:"Asia/Tokyo"}).format(new Date()));
const requestedFocus=new URLSearchParams(location.search).get("focus");
const state={month:null,level:null,tags:new Set(),area:null};
let allResorts=[],filteredResorts=[],map,clusters,markers=new Map(),mapReady=false,articlesByResort=new Map();
const mobileQuery=matchMedia("(max-width: 959px)");
const esc=value=>String(value??"").replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[char]);

function restoreState(){
  const query=new URLSearchParams(location.search),month=Number(query.get("m"));
  state.month=MONTHS.includes(month)?month:null;
  state.level=VALID.level.has(query.get("lv"))?query.get("lv"):null;
  (query.get("t")||"").split(",").filter(tag=>VALID.tag.has(tag)).forEach(tag=>state.tags.add(tag));
  state.area=VALID.area.has(query.get("a"))?query.get("a"):null;
}
function syncUrl(){
  const query=new URLSearchParams();
  if(state.month)query.set("m",state.month);if(state.level)query.set("lv",state.level);
  if(state.tags.size)query.set("t",[...state.tags].join(","));if(state.area)query.set("a",state.area);
  if(requestedFocus)query.set("focus",requestedFocus);
  history.replaceState(null,"",location.pathname+(query.size?"?"+query.toString().replace(/%2C/gi,","):"")+location.hash);
}
function hasFilters(){return Boolean(state.month||state.level||state.tags.size||state.area)}
function updateControls(){
  document.querySelectorAll('[data-filter="month"]').forEach(button=>button.classList.toggle("active",String(state.month||"")===button.dataset.value));
  document.querySelectorAll('[data-filter="level"]').forEach(button=>button.classList.toggle("active",String(state.level||"")===button.dataset.value));
  document.querySelectorAll('[data-filter="tag"]').forEach(button=>button.classList.toggle("active",state.tags.has(button.dataset.value)));
  document.getElementById("area").value=state.area||"";document.getElementById("clearFilters").classList.toggle("show",hasFilters());
}
function matches(resort){
  if(state.month&&!resort.months.includes(state.month))return false;
  if(state.level&&!resort.levelFit.includes(state.level))return false;
  if(state.tags.size&&![...state.tags].some(tag=>resort.tags.includes(tag)))return false;
  return !state.area||resort.area===state.area;
}
function monthChart(resort){
  const bars=MONTHS.map(month=>`<span class="month-bar${resort.months.includes(month)?" open":""}${resort.peak.includes(month)?" peak":""}${state.month===month?" selected":""}"></span>`).join("");
  const labels=MONTHS.map(month=>`<span>${month}</span>`).join("");
  return `<div class="month-chart" aria-label="開放月份：${resort.months.join("、")}月；雪況最佳：${resort.peak.join("、")}月"><div class="month-bars">${bars}</div><div class="month-labels">${labels}</div><div class="month-legend">亮藍＝雪況最好 · 淺藍＝開放</div></div>`;
}
function cardHtml(resort){
  const levels=resort.levelFit.map(level=>`<span class="level-badge">${LEVELS[level]}</span>`).join("");
  const tags=resort.tags.map(tag=>`<span title="${TAGS[tag][1]}" aria-label="${TAGS[tag][1]}">${TAGS[tag][0]}</span>`).join("");
  const website=resort.url?`<a class="official-link" href="${esc(resort.url)}" target="_blank" rel="noopener">官網 ↗</a>`:"";
  const guide=articlesByResort.get(resort.id),guideLink=guide?`<a class="guide-link" href="../articles/view.html?slug=${encodeURIComponent(guide.slug)}">攻略 →</a>`:"";
  return `<article class="resort-card area-${esc(resort.area)} reveal" id="card-${esc(resort.id)}" data-id="${esc(resort.id)}" tabindex="0"><h2>${esc(resort.name)}</h2><div class="place">${esc(resort.nameJa)} · ${esc(resort.place)}</div><div class="level-list">${levels}</div><div class="tag-icons">${tags}</div>${monthChart(resort)}<p class="access">🚃 ${esc(resort.access)}</p><p class="see">${esc(resort.see)}</p><div class="card-foot">${resort.verify?'<span class="warning">⚠️ 出發前以官網為準</span>':""}${website}${guideLink}<button class="map-link" type="button" data-map-id="${esc(resort.id)}">在地圖上看 →</button></div></article>`;
}
function render(){
  filteredResorts=allResorts.filter(matches).sort((a,b)=>(AREA_ORDER[a.area]-AREA_ORDER[b.area])||(a.accessMin-b.accessMin)||a.name.localeCompare(b.name,"zh-Hant"));
  document.getElementById("resultCount").innerHTML=`符合 <strong>${filteredResorts.length}</strong> / ${allResorts.length} 個雪場`;
  document.getElementById("mobileResultCount").innerHTML=`符合 <strong>${filteredResorts.length}</strong> / ${allResorts.length} 個雪場`;
  document.getElementById("cards").innerHTML=filteredResorts.length?filteredResorts.map(cardHtml).join(""):`<div class="empty">這個組合目前沒有雪場。試試放寬月份或程度？<button class="chip" type="button" data-empty-clear>清除篩選</button></div>`;
  observeReveal(document.getElementById("cards"));syncUrl();updateControls();updateMap();
}
function popupHtml(resort){
  const levels=resort.levelFit.map(level=>`<span class="pop-badge">${LEVELS[level]}</span>`).join("");
  const note=resort.note?`<p><b>注意</b>${esc(resort.note)}</p>`:"";
  const website=resort.url?`<p><a href="${esc(resort.url)}" target="_blank" rel="noopener">官網 ↗</a></p>`:"";
  return `<div class="pop"><h3>${esc(resort.name)}</h3><div class="pop-name-ja">${esc(resort.nameJa)}</div><div class="pop-levels">${levels}</div><p><b>交通</b>${esc(resort.access)}</p><p><b>亮點</b>${esc(resort.see)}</p>${note}${website}</div>`;
}
function initMap(){
  map=L.map("map",{scrollWheelZoom:false,touchZoom:true,minZoom:3,maxZoom:16,worldCopyJump:true}).setView([38.2,138],5);
  map.attributionControl.setPrefix(false);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Tiles © Esri"}).addTo(map);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,pane:"overlayPane"}).addTo(map);
  clusters=L.markerClusterGroup({maxClusterRadius:44,showCoverageOnHover:false,spiderfyOnMaxZoom:true,iconCreateFunction:cluster=>{const count=cluster.getChildCount(),size=count<10?32:count<20?38:44;return L.divIcon({html:`<div class="resort-cluster" style="width:${size}px;height:${size}px">${count}</div>`,className:"marker-cluster",iconSize:[size,size]})}}).addTo(map);
  const icon=L.divIcon({className:"resort-marker",html:'<div class="pin"></div>',iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-8]});
  allResorts.forEach(resort=>{const marker=L.marker([resort.lat,resort.lng],{icon,title:resort.name}).bindPopup(popupHtml(resort));marker.on("mouseover",()=>document.getElementById(`card-${resort.id}`)?.classList.add("marker-active"));marker.on("mouseout",()=>document.getElementById(`card-${resort.id}`)?.classList.remove("marker-active"));marker.on("click",()=>highlightCard(resort.id));markers.set(resort.id,marker)});
  const container=map.getContainer();container.addEventListener("wheel",event=>{if(event.ctrlKey||event.metaKey){event.preventDefault();map.setZoomAround(map.mouseEventToLatLng(event),map.getZoom()-event.deltaY*.02)}},{passive:false});
  mapReady=true;updateMap();
}
function mapIsVisible(){return !mobileQuery.matches||document.body.classList.contains("view-map")}
function updateMap(){
  if(!mapReady)return;clusters.clearLayers();filteredResorts.forEach(resort=>clusters.addLayer(markers.get(resort.id)));
  if(filteredResorts.length&&mapIsVisible()){map.invalidateSize(false);map.fitBounds(L.latLngBounds(filteredResorts.map(resort=>[resort.lat,resort.lng])),{padding:[40,40],maxZoom:9,animate:!reduceMotion})}
}
function highlightCard(id){const card=document.getElementById(`card-${id}`);if(!card)return;card.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"center"});card.classList.remove("flash");void card.offsetWidth;card.classList.add("flash");setTimeout(()=>card.classList.remove("flash"),1500)}
function setView(view,{scroll=true,fit=true}={}){document.body.classList.toggle("view-map",view==="map");document.body.classList.toggle("view-list",view==="list");document.querySelectorAll("[data-view]").forEach(button=>button.classList.toggle("active",button.dataset.view===view));if(view==="map"&&mapReady)setTimeout(()=>{map.invalidateSize();if(fit&&filteredResorts.length)map.fitBounds(L.latLngBounds(filteredResorts.map(resort=>[resort.lat,resort.lng])),{padding:[40,40],maxZoom:9,animate:!reduceMotion})},50);if(scroll&&mobileQuery.matches)document.getElementById("viewSwitch").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"})}
function focusResort(id){const resort=allResorts.find(item=>item.id===id),marker=markers.get(id);if(!resort||!marker)return;if(mobileQuery.matches)setView("map",{fit:false});setTimeout(()=>{map.invalidateSize();if(reduceMotion){map.setView([resort.lat,resort.lng],10,{animate:false});map.openPopup(marker.getPopup().setLatLng([resort.lat,resort.lng]))}else{map.once("moveend",()=>map.openPopup(marker.getPopup().setLatLng([resort.lat,resort.lng])));map.flyTo([resort.lat,resort.lng],10,{duration:.8})}},mobileQuery.matches?100:0)}
function hotMarker(id,on){const marker=markers.get(id),visible=marker&&clusters.getVisibleParent(marker),element=visible?.getElement();if(element)element.classList.toggle("marker-hot",on)}
function clearAll(){state.month=null;state.level=null;state.tags.clear();state.area=null;document.getElementById("seasonHint").classList.remove("show");render()}
function measureChrome(){document.documentElement.style.setProperty("--filters-height",document.getElementById("filters").offsetHeight+"px");document.documentElement.style.setProperty("--switch-height",document.getElementById("viewSwitch").offsetHeight+"px")}

document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{const type=button.dataset.filter,value=button.dataset.value;document.getElementById("seasonHint").classList.remove("show");if(type==="month")state.month=value?Number(value):null;else if(type==="level")state.level=value||null;else state.tags.has(value)?state.tags.delete(value):state.tags.add(value);render()}));
document.getElementById("thisMonth").addEventListener("click",()=>{if(MONTHS.includes(currentMonth)){state.month=currentMonth;document.getElementById("seasonHint").classList.remove("show")}else{state.month=12;document.getElementById("seasonHint").classList.add("show")}render()});
document.getElementById("area").addEventListener("change",event=>{state.area=event.target.value||null;render()});
document.getElementById("clearFilters").addEventListener("click",clearAll);
document.getElementById("backToFilters").addEventListener("click",()=>document.getElementById("filters").scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}));
document.getElementById("cards").addEventListener("click",event=>{if(event.target.closest("a"))return;if(event.target.closest("[data-empty-clear]")){clearAll();return}const card=event.target.closest(".resort-card");if(card)focusResort(card.dataset.id)});
document.getElementById("cards").addEventListener("keydown",event=>{const card=event.target.closest(".resort-card");if(card&&(event.key==="Enter"||event.key===" ")){event.preventDefault();focusResort(card.dataset.id)}});
document.getElementById("cards").addEventListener("mouseover",event=>{const card=event.target.closest(".resort-card");if(card)hotMarker(card.dataset.id,true)});
document.getElementById("cards").addEventListener("mouseout",event=>{const card=event.target.closest(".resort-card");if(card&&!card.contains(event.relatedTarget))hotMarker(card.dataset.id,false)});
document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>setView(button.dataset.view)));
new ResizeObserver(measureChrome).observe(document.getElementById("filters"));addEventListener("resize",()=>{measureChrome();if(mapReady)setTimeout(()=>map.invalidateSize(),50)});

restoreState();updateControls();measureChrome();
Promise.allSettled([
  fetch("../data/resorts.json").then(response=>{if(!response.ok)throw new Error("resorts.json");return response.json()}),
  fetch("../content/index.json").then(response=>{if(!response.ok)throw new Error("index.json");return response.json()})
]).then(([resortResult,articleResult])=>{
  if(resortResult.status!=="fulfilled")throw new Error("resorts.json");
  if(articleResult.status==="fulfilled")for(const article of articleResult.value.articles||[]){if(article.resort&&!articlesByResort.has(article.resort))articlesByResort.set(article.resort,article)}
  const data=resortResult.value;allResorts=data.resorts;document.getElementById("dataNote").textContent=`季節、交通與票價每年變動，出發前請以各雪場官網為準。Sarayuki 不收費排名。資料更新：${data.updated}`;render();initMap();
  if(requestedFocus&&allResorts.some(resort=>resort.id===requestedFocus))focusResort(requestedFocus);
}).catch(()=>{document.getElementById("resultCount").textContent="雪場資料載入失敗";document.getElementById("mobileResultCount").textContent="載入失敗";document.getElementById("cards").innerHTML='<div class="empty">目前無法讀取雪場資料，請稍後再試。</div>';document.getElementById("map").innerHTML='<div class="load-error">地圖資料暫時無法載入。</div>'});
</script>
